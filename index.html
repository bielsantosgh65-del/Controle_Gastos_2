 open(){if(this._p)return this._p;this._p=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('sem IndexedDB'));const r=indexedDB.open('financas-moto',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return this._p;},
 get(k){return this.open().then(db=>new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));},
 set(k,v){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));}
};

async function loadLocal(){
 let loc=null,idb=null,seed=null;
 try{const t=localStorage.getItem(LS_KEY);if(t)loc=JSON.parse(t);}catch(e){}
 try{idb=await Promise.race([IDB.get('state'),sleep(3000).then(()=>null)]);}catch(e){}

 try{const m=await Promise.race([IDB.get('meta'),sleep(1500).then(()=>null)]);if(m&&m.lastBackup)lastBackup=m.lastBackup;}catch(e){}

 if(src&&src.dados)COLS.forEach(c=>S[c]=src.dados[c]||{});

async function setupApp(){

   const track=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){updateReady=w;schedule();}});};
   if(reg.waiting&&navigator.serviceWorker.controller){updateReady=reg.waiting;}

function startCloud(){
 const pend=new Set(COLS);
 const timer=setTimeout(()=>{if(pend.size){statusMsg='Os dados ainda não carregaram. Verifique sua conexão; o painel será atualizado sozinho.';schedule();}},10000);
 COLS.forEach(col=>{
  db.collection(col).onSnapshot(snap=>{
   const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign(clone(d.data()),{id:d.id});});
   wq.forEach(v=>{if(v.col===col){if(v.obj)o[v.id]=v.obj;else delete o[v.id];}});
   S[col]=o;
   if(!snap.metadata.fromCache&&pend.has(col)){pend.delete(col);if(!pend.size){clearTimeout(timer);loaded=true;statusMsg='';}}
   schedule();
  },err=>{pend.delete(col);if(!pend.size){clearTimeout(timer);loaded=true;}statusMsg='Falha ao sincronizar ('+col+'): '+(err&&err.message||err&&err.code)+'. Recarregue o artefato.';schedule();});
 });
}

/* ================= Cálculos: financiamento ================= */
function parcelas(){return Object.values(S.parcelas).sort((a,b)=>a.n-b.n);}
function calc(p,ignorePag){
 let princ=0,jur=0,ant=false,last='';
 (p.pags||[]).forEach(x=>{if(x.id===ignorePag)return;princ+=+x.valor||0;jur+=+x.juros||0;if(x.tipo==='antecipacao')ant=true;if((x.data||'')>last)last=x.data||'';});
 princ=r2(princ);jur=r2(jur);
 const quit=ant||princ>=r2(p.valor)-0.005;
 const eco=ant?r2(Math.max(0,p.valor-princ)):0;
 const rest=quit?0:r2(p.valor-princ);
 const st=quit?(ant?'antecipada':'paga'):(princ>0?'parcial':(p.venc&&p.venc<today()?'atrasada':'pendente'));
 return {princ,jur,ant,quit,eco,rest,st,last,pago:r2(princ+jur),atrasada:!quit&&p.venc&&p.venc<today()};
}
const ST_LABEL={paga:'Paga',antecipada:'Antecipada',parcial:'Parcial',pendente:'Pendente',atrasada:'Atrasada'};
function finStats(){
 const L=parcelas();const o={n:L.length,nominal:0,desemb:0,princ:0,juros:0,eco:0,saldo:0,quit:0,normais:0,antec:0,parciais:0,atras:0,pend:0,pagoNormal:0,pagoAntec:0};
 L.forEach(p=>{const c=calc(p);o.nominal+=p.valor;o.desemb+=c.pago;o.princ+=c.princ;o.juros+=c.jur;o.eco+=c.eco;o.saldo+=c.rest;
  if(c.quit){o.quit++;if(c.ant){o.antec++;o.pagoAntec+=p.valor;}else{o.normais++;o.pagoNormal+=p.valor;}}else if(c.princ>0)o.parciais++;
  if(c.atrasada)o.atras++;if(!c.quit)o.pend++;});
 Object.keys(o).forEach(k=>o[k]=typeof o[k]==='number'&&k!=='n'?r2(o[k]):o[k]);
 return o;
}
function gerarParcelas(silent){

 if(!S.cfg.geral)put('cfg',Object.assign({},DEF_CFG));
 for(let i=1;i<=c.nParcelas;i++){const id='p'+pad(i);if(!S.parcelas[id])put('parcelas',{id,n:i,valor:c.valorParcela,venc:'',pags:[],obs:''});}
}

/* ================= Cálculos: despesas ================= */
function lancamentos(incFin){
 const out=Object.values(S.despesas).map(d=>Object.assign({},d,{auto:false,pago:d.pago!==false}));
 if(incFin!==false)parcelas().forEach(p=>(p.pags||[]).forEach(x=>{out.push({id:'fin-'+x.id,auto:true,pid:p.id,pagId:x.id,data:x.data,cat:'fin',valor:r2((+x.valor||0)+(+x.juros||0)),desc:'Parcela '+pad(p.n)+'/'+pad(cfg().nParcelas)+(x.tipo==='antecipacao'?' (antecipada)':''),obs:x.obs||'',pago:true});}));
 return out.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
function filtrar(L,f){return L.filter(e=>{if(!e.data)return f.ano==='all'&&f.mes==='all';if(f.ano!=='all'&&e.data.slice(0,4)!==f.ano)return false;if(f.mes!=='all'&&e.data.slice(5,7)!==f.mes)return false;if(f.cat!=='all'&&e.cat!==f.cat)return false;return true;});}
function anos(){const s=new Set();lancamentos().forEach(e=>e.data&&s.add(e.data.slice(0,4)));Object.values(S.movres).forEach(m=>m.data&&s.add(m.data.slice(0,4)));s.add(today().slice(0,4));return [...s].sort().reverse();}
function mesesPeriodo(L,f){
 const cur=ym(today());const ds=L.map(e=>ym(e.data)).filter(Boolean).sort();
 if(f.ano!=='all'&&f.mes!=='all')return [f.ano+'-'+f.mes];
 if(f.mes!=='all'){const s=new Set(ds.filter(d=>d.slice(5)===f.mes));return s.size?[...s]:[cur];}
 let ini,fim;
 if(f.ano!=='all'){const dy=ds.filter(d=>d.startsWith(f.ano));ini=dy[0]||f.ano+'-01';fim=f.ano===cur.slice(0,4)?cur:(f.ano<cur.slice(0,4)?f.ano+'-12':(dy[dy.length-1]||f.ano+'-01'));if(dy.length&&dy[dy.length-1]>fim)fim=dy[dy.length-1];}
 else{if(!ds.length)return [cur];ini=ds[0];fim=ds[ds.length-1]>cur?ds[ds.length-1]:cur;}
 if(ini>fim)ini=fim;return monthRange(ini,fim);
}
function combStats(){
 const fc=fuelCats();const L=Object.values(S.despesas).filter(d=>fc.includes(d.cat)&&d.pago!==false);
 let valor=0,litros=0,litrosComPreco=0,valorComLitros=0;L.forEach(d=>{valor+=+d.valor||0;if(+d.litros>0){litros+=+d.litros;litrosComPreco+=+d.litros;valorComLitros+=+d.valor||0;}});
 const ck=L.filter(d=>+d.km>0&&+d.litros>0).sort((a,b)=>a.km-b.km);
 let dist=0,lit=0;const serie=[];
 for(let i=1;i<ck.length;i++){const dd=ck[i].km-ck[i-1].km;if(dd>0){dist+=dd;lit+=+ck[i].litros;serie.push({data:ck[i].data,kml:dd/ck[i].litros,km:ck[i].km});}}
 return {valor:r2(valor),litros,precoMedio:litrosComPreco?valorComLitros/litrosComPreco:0,kml:lit?dist/lit:0,ultimo:serie.length?serie[serie.length-1].kml:0,serie,n:L.length};
}
function odometro(){
 let m=+cfg().kmInicial||0;
 Object.values(S.km).forEach(k=>{if(+k.km>m)m=+k.km;});
 Object.values(S.despesas).forEach(d=>{if(+d.km>m)m=+d.km;});
 Object.values(S.revisoes).forEach(r=>{if(+r.km>m)m=+r.km;});
 return m;
}

function proxData(a){if(!a.data)return '';if(!a.anual)return a.data;let d=a.data;let i=0;while(d<today()&&i<100){d=addMonths(d,12);i++;}return d;}
function alertas(){
 const c=cfg(),out=[],t=today();
 parcelas().forEach(p=>{const k=calc(p);if(k.quit||!p.venc)return;const dd=daysTo(p.venc);
  if(dd<0)out.push({lv:'danger',t:'Parcela '+pad(p.n)+' vencida há '+(-dd)+' dia(s)',m:'Vencimento '+fd(p.venc)+' · saldo '+brl(k.rest),go:'financiamento'});
  else if(dd<=c.diasAlerta)out.push({lv:'warn',t:'Parcela '+pad(p.n)+(dd===0?' vence hoje':' vence em '+dd+' dia(s)'),m:'Vencimento '+fd(p.venc)+' · '+brl(k.rest),go:'financiamento'});});
 const semVenc=parcelas().filter(p=>!p.venc&&!calc(p).quit).length;
 if(semVenc)out.push({lv:'info',t:semVenc+' parcela(s) sem data de vencimento',m:'Use "Preencher vencimentos" na aba Financiamento para receber avisos.',go:'financiamento'});
 Object.values(S.despesas).forEach(d=>{if(d.pago!==false||!d.data)return;const dd=daysTo(d.data);if(dd<0)out.push({lv:'danger',t:d.desc+' vencida há '+(-dd)+' dia(s)',m:catById(d.cat).nome+' · '+fd(d.data)+' · '+brl(d.valor),go:'despesas'});else if(dd<=c.diasAlerta)out.push({lv:'warn',t:d.desc+(dd===0?' vence hoje':' vence em '+dd+' dia(s)'),m:catById(d.cat).nome+' · '+fd(d.data)+' · '+brl(d.valor),go:'despesas'});});
 const odo=odometro();
 const revs=Object.values(S.revisoes).filter(r=>r.proxKm||r.proxData).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
 if(revs.length){const r=revs[0];
  if(+r.proxKm){const f=r.proxKm-odo;if(f<=0)out.push({lv:'danger',t:'Revisão atrasada pela quilometragem',m:'Prevista para '+ni(r.proxKm)+' km · odômetro em '+ni(odo)+' km',go:'moto'});else if(f<=c.kmAviso)out.push({lv:'warn',t:'Revisão em '+ni(f)+' km',m:'Prevista para '+ni(r.proxKm)+' km',go:'moto'});}
  if(r.proxData){const dd=daysTo(r.proxData);if(dd<0)out.push({lv:'danger',t:'Revisão atrasada pela data',m:'Prevista para '+fd(r.proxData),go:'moto'});else if(dd<=c.diasAvisoRev)out.push({lv:'warn',t:'Revisão em '+dd+' dia(s)',m:'Prevista para '+fd(r.proxData),go:'moto'});}
 }
 Object.values(S.alertas).forEach(a=>{if(a.feito&&!a.anual)return;const d=proxData(a);if(!d)return;const dd=daysTo(d);const ant=+a.antecedencia||0;

  else if(dd<=ant)out.push({lv:'warn',t:a.titulo+(dd===0?' é hoje':' em '+dd+' dia(s)'),m:'Data '+fd(d)+(a.valor?' · '+brl(a.valor):''),go:'alertas'});});
 if(!window.claude){const n=Object.keys(S.despesas).length+Object.keys(S.movres).length+parcelas().filter(p=>(p.pags||[]).length).length;const dias=lastBackup?Math.floor((Date.now()-lastBackup)/864e5):null;if(n&&(dias===null||dias>=30))out.push({lv:'warn',t:dias===null?'Nenhum backup feito ainda':'Último backup há '+dias+' dias',m:'Exporte o backup (.json) e guarde no Drive, iCloud ou e-mail. Ele é a única cópia fora deste aparelho.',go:'dados'});}
 const ord={danger:0,warn:1,info:2};return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);

/* ================= Gráficos SVG ================= */
function niceMax(m){if(m<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
function shortBRL(v){if(v>=1000)return 'R$ '+nf(v/1000,v>=10000?0:1)+' mil';return 'R$ '+ni(v);}
function stackBars(cols,opts){
 opts=opts||{};const W=680,H=250,L=58,R=8,T=12,B=30;const iw=W-L-R,ih=H-T-B;
 const tot=cols.map(c=>c.segs.reduce((s,x)=>s+x.v,0));const max=niceMax(Math.max(...tot,0));
 const n=cols.length||1;const bw=Math.min(38,iw/n*0.62);let g='';
 for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+shortBRL(max*i/4)+'</text>';}
 cols.forEach((c,i)=>{const cx=L+iw*(i+.5)/n;let y=T+ih;
  c.segs.forEach(s=>{if(s.v<=0)return;const h=ih*s.v/max;y-=h;g+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,0.5)+'" fill="'+s.cor+'" rx="2"><title>'+esc(c.label+' · '+s.nome+': '+brl(s.v))+'</title></rect>';});
  if(tot[i]>0&&opts.top)g+='<text x="'+cx+'" y="'+(y-4)+'" text-anchor="middle">'+shortBRL(tot[i])+'</text>';
  if(n<=14||i%2===0)g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(c.label)+'</text>';});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'Gráfico de barras')+'">'+g+'</svg>';
}
function donut(items,center){
 const tot=items.reduce((s,x)=>s+x.v,0);const R=80,r=52,C=90;let a=-Math.PI/2,g='';
 if(tot<=0)g='<circle cx="90" cy="90" r="66" fill="none" stroke="var(--surface2)" stroke-width="28"/>';
 items.forEach(x=>{if(x.v<=0)return;const f=x.v/tot;const a2=a+f*Math.PI*2-(f>=1?0.0001:0);const lg=f>.5?1:0;
  const p=(rr,an)=>(C+rr*Math.cos(an)).toFixed(2)+' '+(C+rr*Math.sin(an)).toFixed(2);
  g+='<path d="M'+p(R,a)+' A'+R+' '+R+' 0 '+lg+' 1 '+p(R,a2)+' L'+p(r,a2)+' A'+r+' '+r+' 0 '+lg+' 0 '+p(r,a)+' Z" fill="'+x.cor+'"><title>'+esc(x.nome+': '+brl(x.v)+' ('+nf(f*100)+'%)')+'</title></path>';a=a2;});
 g+='<text class="ctr" x="90" y="90" text-anchor="middle">'+esc(center||'')+'</text><text x="90" y="108" text-anchor="middle">total</text>';
 return '<svg class="chart" viewBox="0 0 180 180" role="img" aria-label="Distribuição">'+g+'</svg>';
}
function lineChart(pts,fmt){
 const W=680,H=200,L=44,R=10,T=12,B=28,iw=W-L-R,ih=H-T-B;if(pts.length<2)return '<div class="empty small">Registre pelo menos dois abastecimentos com km e litros para ver a evolução do consumo.</div>';
 const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mn-=1;mx+=1;}mn=Math.floor(mn);mx=Math.ceil(mx);
 const X=i=>L+iw*i/(pts.length-1),Y=v=>T+ih-(v-mn)/(mx-mn)*ih;let g='';
 for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+nf(v,1)+'</text>';}
 const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 g+='<path d="'+d+' L'+X(pts.length-1)+' '+(T+ih)+' L'+L+' '+(T+ih)+' Z" fill="var(--green)" opacity=".12"/><path d="'+d+'" fill="none" stroke="var(--green)" stroke-width="2.5"/>';
 pts.forEach((p,i)=>{g+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(i===pts.length-1?5:3)+'" fill="var(--green)"><title>'+esc(p.label+': '+fmt(p.v))+'</title></circle>';if(pts.length<=12||i%Math.ceil(pts.length/10)===0)g+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(p.label)+'</text>';});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Consumo km/L">'+g+'</svg>';
}

function progressFin(f){

 return '<div class="seg" role="img" aria-label="Progresso da quitação"><div style="width:'+pn+'%;background:var(--green)"></div><div style="width:'+pa+'%;background:var(--teal)"></div><div style="width:'+parc+'%;background:var(--khaki)"></div></div>'
 +'<div class="legend"><span><i class="dot" style="background:var(--green)"></i>Pagas: '+f.normais+'</span><span><i class="dot" style="background:var(--teal)"></i>Antecipadas: '+f.antec+'</span><span><i class="dot" style="background:var(--khaki)"></i>Parciais: '+f.parciais+'</span><span><i class="dot" style="background:var(--surface2);border:1px solid var(--line)"></i>Pendentes: '+(f.pend-f.parciais)+'</span><span><b>'+nf(f.quit/(f.n||1)*100,0)+'% quitado</b></span></div>';
}

 const meses=mesesPeriodo(all,fl);const media=meses.length?total/meses.length:0;
 const cs=combStats();const fuelPer=r2(L.filter(e=>fuelCats().includes(e.cat)).reduce((s,e)=>s+e.valor,0));
 const rs=reservas().map(r=>resStats(r));const saldoRes=r2(rs.reduce((s,x)=>s+x.saldo,0));

 let h='<div class="stack"><div class="sec-head"><h2 class="sec">Painel · '+esc(per)+'</h2>'+filterBar()+'</div>';
 if(alts.length)h+='<div class="panel"><h3>Alertas</h3>'+alertList(alts,4)+'</div>';
 h+='<div class="grid-kpi">'
  +kpi('Custo no período',brl(total),L.length+' lançamento(s)'+(ui.cat!=='all'?' · '+esc(catById(ui.cat).nome):''),'hl')
  +kpi('Custo médio mensal',brl(media),meses.length+' mês(es) considerados')
  +kpi('Pago no financiamento',brl(f.desemb),f.quit+' de '+f.n+' parcelas quitadas')
  +kpi('Saldo a quitar',brl(f.saldo),f.pend+' parcela(s) em aberto'+(f.atras?' · <span class="neg">'+f.atras+' atrasada(s)</span>':''))
  +kpi('Economia com antecipações',brl(f.eco),f.antec+' parcela(s) antecipada(s)')
  +kpi('Combustível no período',brl(fuelPer),cs.kml?'Média geral '+nf(cs.kml)+' km/L':'Informe km e litros para medir o consumo')
  +kpi('Saldo das reservas',brl(saldoRes),rs.length+' reserva(s)')
  +kpi('Odômetro',ni(odometro())+' km',(odometro()-(+cfg().kmInicial||0))>0?ni(odometro()-(+cfg().kmInicial||0))+' km rodados desde a compra':'Registre a quilometragem na aba Moto')
  +'</div>';
 // evolução mensal
 let mk;if(ui.ano!=='all')mk=monthRange(ui.ano+'-01',ui.ano+'-12');else{const cur=ym(today());mk=monthRange(addMonths(cur+'-01',-11).slice(0,7),cur);}
 const flM={ano:'all',mes:'all',cat:ui.cat};const LM=filtrar(all,flM);
 const cols=mk.map(k=>{const segs=cats().map(c=>({nome:c.nome,cor:c.cor,v:r2(LM.filter(e=>e.cat===c.id&&ym(e.data)===k).reduce((s,e)=>s+e.valor,0))}));return {label:ymLabel(k),segs};});
 const byCat=cats().map(c=>({nome:c.nome,cor:c.cor,v:r2(L.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.valor,0))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 h+='<div class="cols2"><div class="panel"><h3>Evolução mensal '+(ui.ano!=='all'?ui.ano:'· últimos 12 meses')+'</h3>'+stackBars(cols,{top:true,aria:'Custo mensal por categoria'})
  +'<div class="legend">'+cats().filter(c=>LM.some(e=>e.cat===c.id&&mk.includes(ym(e.data)))).map(c=>'<span><i class="dot" style="background:'+esc(c.cor)+'"></i>'+esc(c.nome)+'</span>').join('')+'</div></div>'
  +'<div class="panel"><h3>Distribuição dos gastos</h3>'+(byCat.length?'<div class="donut-wrap">'+donut(byCat,shortBRL(total))+'<div class="donut-leg">'+byCat.map(x=>'<div><span class="cat"><span class="dot" style="background:'+esc(x.cor)+'"></span>'+esc(x.nome)+'</span><span>'+brl(x.v)+' · '+nf(x.v/total*100,0)+'%</span></div>').join('')+'</div></div>':'<div class="empty"><b>Sem gastos no período</b>Lance despesas ou pagamentos de parcelas para ver a distribuição.</div>')+'</div></div>';
 // progresso
 h+='<div class="panel"><h3>Progresso da quitação do financiamento</h3>'+progressFin(f)
  +'<dl class="kv" style="margin-top:14px"><dt>Valor total financiado</dt><dd>'+brl(f.nominal)+'</dd><dt>Total desembolsado (inclui juros/multas)</dt><dd>'+brl(f.desemb)+'</dd><dt>Juros e multas pagos</dt><dd>'+brl(f.juros)+'</dd><dt>Economia com antecipações</dt><dd class="pos">'+brl(f.eco)+'</dd><dt>Saldo das parcelas não quitadas</dt><dd><b>'+brl(f.saldo)+'</b></dd></dl></div>';
 // anual + projeção
 const A=anos().slice().sort();const cur=ym(today());

 const pj=projecao();

  +'<div class="panel"><h3>Projeção · próximos 12 meses</h3>'+stackBars(pj.cols,{aria:'Projeção de despesas'})

  +'<p class="small muted" style="margin:10px 0 0">Total previsto: <b>'+brl(pj.total)+'</b>. '+(pj.semVenc?pj.semVenc+' parcela(s) sem vencimento não entram na projeção. ':'')+'A média usa os últimos 6 meses de despesas avulsas (sem financiamento e sem compras parceladas).</p></div></div>';
 h+='</div>';return h;
}
function projecao(){
 const cur=ym(today());const mk=monthRange(cur,addMonths(cur+'-01',11).slice(0,7));
 const outros=Object.values(S.despesas).filter(d=>d.cat!=='fin'&&d.pago!==false&&!d.grupo);const datas=outros.map(d=>ym(d.data)).filter(Boolean).sort();
 let media=0;if(datas.length){const ini=[datas[0],addMonths(cur+'-01',-5).slice(0,7)].sort()[1];const ms=monthRange(ini,cur);const t=outros.filter(d=>ms.includes(ym(d.data))).reduce((s,d)=>s+(+d.valor||0),0);media=t/ms.length;}
 let semVenc=0;const fin={};parcelas().forEach(p=>{const c=calc(p);if(c.quit)return;if(!p.venc){semVenc++;return;}let k=ym(p.venc);if(k<cur)k=cur;fin[k]=(fin[k]||0)+c.rest;});
 const ag={};Object.values(S.despesas).forEach(d=>{if(d.pago!==false||!d.data)return;let k=ym(d.data);if(k<cur)k=cur;if(mk.includes(k))ag[k]=(ag[k]||0)+(+d.valor||0);});
 const al={};Object.values(S.alertas).forEach(a=>{if(!+a.valor||(a.feito&&!a.anual))return;const d=proxData(a);if(!d)return;let k=ym(d);if(k<cur)k=cur;if(mk.includes(k))al[k]=(al[k]||0)+(+a.valor);if(a.anual){const k2=ym(addMonths(d,12));if(mk.includes(k2))al[k2]=(al[k2]||0)+(+a.valor);}});
 let total=0;const cols=mk.map(k=>{const s=[{nome:'Parcelas',cor:'#004976',v:r2(fin[k]||0)},{nome:'Despesas agendadas',cor:'#005E5D',v:r2(ag[k]||0)},{nome:'Demais despesas (média)',cor:'#C4D600',v:r2(media)},{nome:'Alertas',cor:'#BFBB98',v:r2(al[k]||0)}];total+=s.reduce((a,b)=>a+b.v,0);return {label:ymLabel(k),segs:s};});
 return {cols,media,total,semVenc};
}

function mPagar(pid,tipo,pagId){

 const ant=tipo==='antecipacao';
 const o=editing?{html:'<option value="'+pid+'">'+pad(S.parcelas[pid].n)+'</option>',n:1}:optParcelas(pid,true,ant);
 if(!o.n){toast('Todas as parcelas já estão quitadas.');return;}
 openModal({title:editing?'Editar pagamento':(ant?'Antecipar parcela com desconto':'Registrar pagamento de parcela'),
  body:(ant&&!editing?'<div class="info-box">A antecipação quita a parcela escolhida pelo valor pago com desconto. A diferença para o valor nominal vira economia. Por padrão é sugerida a última parcela em aberto.</div>':'')
   +fld('Parcela',(editing?'<select name="pid" disabled>':'<select name="pid" id="m-pid">')+o.html+'</select>')
   +'<div class="frow">'+fld(ant?'Data da antecipação':'Data do pagamento',inp('data',pag?pag.data:today(),'type="date" required'))+fld(ant?'Valor pago com desconto (R$)':'Valor pago da parcela (R$)',money('valor',pag?pag.valor:''))+'</div>'
   +(!ant?fld('Juros/multa por atraso (R$, opcional)',money('juros',pag?pag.juros:'')):'')

   +'<div class="info-box" id="m-prev"></div>',
  submit:editing?'Salvar alterações':(ant?'Confirmar antecipação':'Registrar pagamento'),
  extra:!editing&&!ant?'<button type="button" class="btn sm ghost" id="m-fill" style="margin-right:auto">Preencher saldo</button>':'',
  onInput:form=>{const id=editing?pid:form.pid.value;const p=S.parcelas[id];if(!p)return;const k=calc(p,pagId);const v=parseNum(form.valor.value);let t='Valor nominal: <b>'+brl(p.valor)+'</b> · já pago: '+brl(k.princ)+' · saldo: <b>'+brl(k.rest)+'</b>';
   if(ant&&v>0)t+='<br>Economia nesta antecipação: <b class="pos">'+brl(Math.max(0,k.rest-v))+'</b> ('+nf(Math.max(0,(k.rest-v)/p.valor*100),2)+'%)';
   else if(!ant&&v>0)t+='<br>'+(v>=k.rest-0.005?'Esta parcela ficará <b>quitada</b>.':'Pagamento parcial. Restará <b>'+brl(k.rest-v)+'</b>.');
   form.querySelector('#m-prev').innerHTML=t;
   const fb=document.getElementById('m-fill');if(fb)fb.onclick=()=>{form.valor.value=nf(k.rest,2);modalCtx.onInput(form);};},
  onSubmit:v=>{
   const id=editing?pid:v.pid;const p=clone(S.parcelas[id]);if(!p)return 'Selecione a parcela.';
   const k=calc(p,pagId);
   if(!editing&&k.quit)return 'Esta parcela já está quitada. Edite o pagamento existente no histórico.';
   if(!v.data)return 'Informe a data.';
   const val=r2(parseNum(v.valor));if(!(val>0))return 'Informe um valor maior que zero.';
   if(val>k.rest+0.005)return 'O valor ('+brl(val)+') é maior que o saldo da parcela ('+brl(k.rest)+'). '+(ant?'':'Lance a diferença no campo de juros/multa.');
   const jur=ant?0:r2(parseNum(v.juros)||0);if(jur<0)return 'Juros inválidos.';

   p.pags=(p.pags||[]).filter(x=>x.id!==obj.id);p.pags.push(obj);

   if(!r&&v.lancar&&val>0){const cat=v.tipo==='Corretiva'?'man':'rev';put('despesas',{id:uid(),data:obj.data,cat:cats().some(c=>c.id===cat)?cat:'out',desc:'Revisão '+v.tipo.toLowerCase()+(obj.km?' · '+ni(obj.km)+' km':''),valor:val,litros:0,km:obj.km,obs:obj.desc});}
   toast('Revisão registrada.');}});
}

function mAlerta(id){const a=id?S.alertas[id]:null;openModal({title:a?'Editar lembrete':'Novo lembrete',body:fld('Título',inp('titulo',a?a.titulo:'','placeholder="Ex.: IPVA 2027"'))+'<div class="frow">'+fld('Data',inp('data',a?a.data:'','type="date"'))+fld('Avisar com antecedência (dias)',inp('antecedencia',a?a.antecedencia:15,'type="number" min="0"'))+'</div><div class="frow">'+fld('Valor previsto (R$, opcional)',money('valor',a?a.valor:''))+fld('Repetição','<select name="anual"><option value="0">Única</option><option value="1"'+(a&&a.anual?' selected':'')+'>Anual</option></select>')+'</div>'+fld('Observação',inp('obs',a?a.obs:'')),
 onSubmit:v=>{if(!(v.titulo||'').trim())return 'Informe o título.';if(!v.data)return 'Informe a data.';put('alertas',{id:a?a.id:uid(),titulo:v.titulo.trim(),data:v.data,antecedencia:parseInt(v.antecedencia,10)||0,valor:r2(parseNum(v.valor)||0),anual:v.anual==='1',obs:v.obs||'',feito:a?!!a.feito:false});toast('Lembrete salvo.');}});}
function mCfgAl(){const c=cfg();openModal({title:'Configurar avisos',body:fld('Avisar parcelas com quantos dias de antecedência',inp('diasAlerta',c.diasAlerta,'type="number" min="0"'))+'<div class="frow">'+fld('Avisar revisão a quantos km',inp('kmAviso',c.kmAviso,'type="number" min="0"'))+fld('Avisar revisão a quantos dias',inp('diasAvisoRev',c.diasAvisoRev,'type="number" min="0"'))+'</div>',onSubmit:v=>{put('cfg',Object.assign({},cfg(),{diasAlerta:+v.diasAlerta||0,kmAviso:+v.kmAviso||0,diasAvisoRev:+v.diasAvisoRev||0}));toast('Avisos configurados.');}});}

/* ================= Backup ================= */
function snapshotData(){const o={};COLS.forEach(c=>o[c]=clone(S[c]));return o;}
function exportObj(){return {app:'financas-moto',versao:1,savedAt:Date.now(),exportadoEm:new Date().toISOString(),dados:snapshotData()};}
function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());}
async function saveFile(name,text,mime){
 if(downloads){try{await downloads.save({filename:name,data:text});toast('Arquivo salvo.');return true;}catch(e){if(e&&e.code==='declined')return false;if(e&&e.code==='rate_limited'){toast('Já existe um download aguardando confirmação.','err');return false;}}}
 if(!(window.claude)){
  let coarse=false;try{coarse=matchMedia('(pointer: coarse)').matches;}catch(e){}
  if(coarse&&navigator.canShare&&navigator.share){try{const f=new File([text],name,{type:mime});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});toast('Arquivo enviado.');return true;}}catch(e){if(e&&e.name==='AbortError')return false;}}
  try{const b=new Blob([text],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo gerado: '+name);return true;}catch(e){}}
 openModal({title:'Copie o conteúdo',wide:true,body:'<p class="small muted" style="margin:0">O download não está disponível nesta visualização. Copie o texto abaixo e salve como <b>'+esc(name)+'</b>.</p><textarea id="m-copy" style="min-height:260px;font-family:monospace;font-size:12px" readonly>'+esc(text)+'</textarea>',extra:'<button type="button" class="btn pri" id="m-cp">Copiar</button>'});
 const ta=document.getElementById('m-copy');document.getElementById('m-cp').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('Copiado.')).catch(()=>{ta.focus();ta.select();});};
}
function icsEvents(){
 const c=cfg(),t=today(),ev=[];
 parcelas().forEach(p=>{const k=calc(p);if(k.quit||!p.venc||p.venc<t)return;ev.push({uid:'parc-'+p.id,d:p.venc,t:'Parcela '+pad(p.n)+'/'+pad(c.nParcelas)+' da moto – '+brl(k.rest),x:'Financiamento da moto',ant:c.diasAlerta});});
 Object.values(S.despesas).forEach(d=>{if(d.pago!==false||!d.data||d.data<t)return;ev.push({uid:'desp-'+d.id,d:d.data,t:d.desc+' – '+brl(d.valor),x:catById(d.cat).nome,ant:c.diasAlerta});});
 Object.values(S.alertas).forEach(a=>{if(a.feito&&!a.anual)return;const d=proxData(a);if(!d||d<t)return;ev.push({uid:'lemb-'+a.id,d,t:a.titulo+(+a.valor?' – '+brl(a.valor):''),x:a.obs||'',ant:+a.antecedencia||0,anual:!!a.anual});});
 const r=Object.values(S.revisoes).filter(r=>r.proxData).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];
 if(r&&r.proxData>=t)ev.push({uid:'rev-'+r.id,d:r.proxData,t:'Revisão da moto'+(+r.proxKm?' (ou '+ni(r.proxKm)+' km)':''),x:'Prevista na revisão de '+fd(r.data),ant:c.diasAvisoRev});
 return ev.sort((a,b)=>a.d.localeCompare(b.d));
}
function ics(){
 const E=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
 const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Financas da Moto//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Finanças da Moto'];
 icsEvents().forEach(e=>{const d=e.d.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+e.uid+'@financas-moto','DTSTAMP:'+st,'DTSTART:'+d+'T090000','DTEND:'+d+'T093000','SUMMARY:'+E(e.t),'DESCRIPTION:'+E(e.x));if(e.anual)L.push('RRULE:FREQ=YEARLY');
  if(e.ant>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+E(e.t),'TRIGGER:-P'+e.ant+'D','END:VALARM');
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+E(e.t),'TRIGGER:PT0M','END:VALARM','END:VEVENT');});
 L.push('END:VCALENDAR');return L.join('\r\n')+'\r\n';
}
function csv(){const rows=[['Data','Categoria','Descrição','Valor','Status','Litros','Km','Observações']];lancamentos(true).slice().reverse().forEach(e=>rows.push([fd(e.data),catById(e.cat).nome,e.desc,nf(e.valor,2),e.pago?'Pago':'A pagar',+e.litros?nf(e.litros,2):'',+e.km?e.km:'',e.obs||'']));return '﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');}
function buildOffline(){
 const css=document.getElementById('app-css').textContent;const js=document.getElementById('app-js').textContent;
 const seed=JSON.stringify(exportObj()).replace(/</g,'\\u003c');
 return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Finanças da Moto</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap"><style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style><style id="app-css">'+css+'</style></head><body><div id="app"><div class="boot">Carregando seus dados…</div></div><div id="modal-root"></div><div id="toast"></div><script id="seed" type="application/json">'+seed+'<\/script><script id="app-js">'+js+'<\/script></body></html>';
}
function validImport(o){if(!o||typeof o!=='object')return null;const d=o.dados||o;if(!d.parcelas||typeof d.parcelas!=='object')return null;return d;}
async function replaceAll(d){
 if(MODE==='cloud'){
  for(const c of COLS){Object.keys(S[c]).forEach(id=>{if(!(d[c]||{})[id])del(c,id);});Object.entries(d[c]||{}).forEach(([id,o])=>put(c,Object.assign({},o,{id})));}
  toast('Importando… acompanhe o contador "Salvando" no topo.');
 }else{COLS.forEach(c=>S[c]=clone(d[c]||{}));saveLocal();schedule();toast('Backup importado.');}
}

/* ================= Toast ================= */
function toast(msg,kind){const t=document.getElementById('toast');if(!t)return;const d=document.createElement('div');if(kind)d.className=kind;d.textContent=msg;t.appendChild(d);setTimeout(()=>d.remove(),kind==='err'?6000:3200);}

/* ================= Eventos ================= */
const ACT={
 tab:d=>{closeModal();ui.tab=d.t;try{sessionStorage.setItem('fm-tab',d.t);}catch(e){}render();window.scrollTo(0,0);},
 gerar:()=>{gerarParcelas();toast('Parcelas geradas.');},
 pf:d=>{ui.pf=d.v;render();},
 pagar:d=>mPagar(d.id,'normal'),antecipar:d=>mPagar(d.id,'antecipacao'),
 editpag:d=>mPagar(d.id,null,d.pag),
 delpag:d=>{const p=S.parcelas[d.id];const x=p&&(p.pags||[]).find(y=>y.id===d.pag);if(!x)return;confirmBox('Excluir pagamento','Excluir o pagamento de <b>'+brl(x.valor)+'</b> em '+fd(x.data)+' da parcela '+pad(p.n)+'? A parcela volta a ficar em aberto.','Excluir',()=>{const q=clone(p);q.pags=q.pags.filter(y=>y.id!==d.pag);put('parcelas',q);toast('Pagamento excluído.');});},
 parc:d=>mParc(d.id),vencs:mVencs,cfgfin:mCfgFin,
 desp:d=>mDesp(d.id),deldesp:d=>{const x=S.despesas[d.id];if(!x)return;confirmBox('Excluir lançamento','Excluir <b>'+esc(x.desc)+'</b> ('+brl(x.valor)+', '+fd(x.data)+')?','Excluir',()=>{del('despesas',d.id);toast('Lançamento excluído.');});},
 pagdesp:d=>{const x=S.despesas[d.id];if(!x)return;openModal({title:'Pagar: '+x.desc,body:'<div class="frow">'+fld('Data do pagamento',inp('data',today(),'type="date"'))+fld('Valor pago (R$)',money('valor',x.valor))+'</div>',submit:'Confirmar pagamento',onSubmit:v=>{const val=r2(parseNum(v.valor));if(!(val>0))return 'Informe o valor.';const q=clone(x);q.pago=true;q.data=v.data||today();q.valor=val;put('despesas',q);toast('Pagamento registrado.');}});},
 cats:mCats,
 res:d=>mRes(d.id),delres:d=>{const r=S.reservas[d.id];const n=Object.values(S.movres).filter(m=>m.res===d.id).length;confirmBox('Excluir reserva','Excluir a reserva <b>'+esc(r.nome)+'</b> e suas '+n+' movimentação(ões)?','Excluir',()=>{Object.values(S.movres).filter(m=>m.res===d.id).forEach(m=>del('movres',m.id));del('reservas',d.id);toast('Reserva excluída.');});},
 ressug:()=>{[['Revisões e manutenção','Manutenção e revisões'],['Seguro','Seguro'],['IPVA e licenciamento','Despesas anuais (IPVA/licenciamento)']].forEach((x,i)=>put('reservas',{id:uid()+i,nome:x[0],tipo:x[1],meta:0,mensal:0,ordem:Date.now()+i}));toast('Reservas criadas. Edite cada uma para definir meta e aporte.');},
 mov:d=>mMov(d.id,d.res,d.tipo),delmov:d=>{const m=S.movres[d.id];if(!m)return;if(m.tipo!=='ret'&&saldoSem(m.res,m.id)<-0.005){toast('Não é possível excluir este '+movL(m.tipo).toLowerCase()+': o saldo da reserva ficaria negativo ('+brl(saldoSem(m.res,m.id))+'). Ajuste os resgates antes.','err');return;}confirmBox('Excluir movimentação','Excluir '+movL(m.tipo).toLowerCase()+' de <b>'+brl(m.valor)+'</b> em '+fd(m.data)+'?','Excluir',()=>{del('movres',d.id);toast('Movimentação excluída.');});},
 aporte:d=>{const r=S.reservas[d.id];put('movres',{id:uid(),res:r.id,tipo:'dep',data:today(),valor:+r.mensal,desc:'Aporte mensal',criado:Date.now()});toast('Aporte de '+brl(r.mensal)+' registrado.');},
 km:d=>mKm(d.id),delkm:d=>confirmBox('Excluir registro','Excluir este registro de quilometragem?','Excluir',()=>del('km',d.id)),
 rev:d=>mRev(d.id),delrev:d=>confirmBox('Excluir revisão','Excluir esta revisão do histórico? A despesa lançada, se houver, continua em Despesas.','Excluir',()=>del('revisoes',d.id)),
 alerta:d=>mAlerta(d.id),cfgal:mCfgAl,delal:d=>confirmBox('Excluir lembrete','Excluir este lembrete?','Excluir',()=>del('alertas',d.id)),
 feito:d=>{const a=clone(S.alertas[d.id]);a.feito=!a.feito;put('alertas',a);},
 alsug:()=>{const y=new Date().getFullYear()+1;[['IPVA '+y,y+'-01-15',20],['Licenciamento '+y,y+'-03-31',20],['Renovação do seguro','',30]].forEach(x=>{if(x[1])put('alertas',{id:uid(),titulo:x[0],data:x[1],antecedencia:x[2],valor:0,anual:true,obs:'Ajuste a data conforme o calendário do seu estado',feito:false});});toast('Lembretes criados. Ajuste as datas e valores.');},
 exp:()=>saveFile('financas-moto-backup-'+stamp()+'.json',JSON.stringify(exportObj(),null,1),'application/json').then(ok=>{if(ok)setLastBackup();}),
 agenda:()=>{const n=icsEvents().length;if(!n){toast('Nenhum vencimento futuro para exportar.');return;}saveFile('financas-moto-agenda-'+stamp()+'.ics',ics(),'text/calendar').then(ok=>{if(ok)toast(n+' evento(s) exportado(s) para a agenda.');});},
 install:()=>{if(!installEvt)return;installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;schedule();});},
 diag:()=>{diag=null;render();},
 update:()=>{if(updateReady)updateReady.postMessage('skipWaiting');else location.reload();},
 expcsv:()=>saveFile('financas-moto-lancamentos-'+stamp()+'.csv',csv(),'text/csv'),
 offline:()=>saveFile('financas-moto-offline-'+stamp()+'.html',buildOffline(),'text/html'),
 reset:()=>openModal({title:'Apagar todos os dados',danger:true,submit:'Apagar tudo',body:'<p style="margin:0">Esta ação não pode ser desfeita. Digite <b>APAGAR</b> para confirmar.</p>'+inp('conf','','autocomplete="off"'),onSubmit:v=>{if(v.conf!=='APAGAR')return 'Digite APAGAR para confirmar.';COLS.forEach(c=>Object.keys(S[c]).forEach(id=>del(c,id)));setTimeout(()=>gerarParcelas(true),50);toast('Dados apagados.');}})
};
document.addEventListener('click',e=>{
 const cl=e.target.closest('[data-close]');if(cl&&(e.target===cl||cl.tagName==='BUTTON')){closeModal();return;}
 const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(!f)return;e.preventDefault();
 if(readOnly&&!['tab','pf','parc','exp','expcsv','offline','agenda','install','update','diag'].includes(el.dataset.act)){toast('Sem permissão para alterar os dados.','err');return;}
 f(el.dataset,el);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.filter){const k=el.dataset.filter;ui[k]=el.type==='checkbox'?el.checked:el.value;render();return;}
 if(el.id==='imp-file'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{let o;try{o=JSON.parse(fr.result);}catch(err){toast('Arquivo inválido: não é um JSON.','err');return;}const d=validImport(o);if(!d){toast('Este arquivo não é um backup do Finanças da Moto.','err');return;}const n=COLS.reduce((s,c)=>s+Object.keys(d[c]||{}).length,0);confirmBox('Importar backup','Substituir todos os dados atuais pelos '+n+' registro(s) do backup'+(o.exportadoEm?' de '+fd(o.exportadoEm.slice(0,10)):'')+'?','Importar',()=>replaceAll(d));};fr.readAsText(el.files[0]);el.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalCtx)closeModal();});
